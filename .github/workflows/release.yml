name: Publish VHemisphere release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.2.0
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: scripts/test-host.sh
      - run: pio run -d software -e VHemisphere -j 4
      - name: Package and publish tested firmware
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir release
          cp software/.pio/build/VHemisphere/VHemisphere-*.hex release/
          cp README.md release/README.md
          (cd release && sha256sum *.hex README.md > SHA256SUMS)
          cp README.md release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease \
            --title "VHemisphere $RELEASE_TAG — Teensy 4.0, 4 CV" --notes-file release-notes.md
