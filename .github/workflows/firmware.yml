name: VHemisphere validation
on: [push, pull_request, workflow_dispatch]
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: scripts/test-host.sh
      - run: pio run -d software -e VHemisphere -j 4
      - uses: actions/upload-artifact@v4
        with:
          name: VHemisphere-Teensy40
          include-hidden-files: true
          path: software/.pio/build/VHemisphere/VHemisphere-v0.2.4-Teensy40.hex
