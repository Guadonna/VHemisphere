[platformio]
src_dir = src
default_envs = VHemisphere

[env:VHemisphere]
framework = arduino
platform = teensy @ 5.2.0
board = teensy41
board_build.f_cpu = 600000000
board_build.ldscript = slot0.ld
platform_packages =
  framework-arduinoteensy @ https://github.com/djphazer/framework-arduinoteensy.git#63259f03b225db6fa45138ec2bc0cc53c4e4a513
  tool-teensy @ 1.162.0
  tool-sreccat @ 1.164.0
lib_deps = https://github.com/beau-seidon/USBHost_t36.git#76d5579e29f37c6486474fda5f320dc439678abc
build_flags =
  -DTEENSY_OPT_SMALLEST_CODE
  -DTEENSY_OPT_SMALLEST_CODE_LTO
  -DUSB_MIDI
  -DUSB_GAMEPAD
  -DDRUMMAP_GRIDS2
  -DVHEMISPHERE_OUTPUT_RANGE
  -Isrc/extern
  -Iteensy-variable-playback/src
  -fno-exceptions
  -falign-functions=32
  -falign-loops=32
  -falign-jumps=32
  -Wall
  -Wfatal-errors
build_src_filter = +<*> +<../teensy-variable-playback/src/*.cpp>
extra_scripts = pre:res/progname.py
upload_protocol = teensy-gui
