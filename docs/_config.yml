title: VHemisphere
description: Bipolar video CV firmware for O_C Teensy 4.0.
remote_theme: just-the-docs/just-the-docs@v0.10.1
color_scheme: dark
permalink: "/:name"

titles_from_headings:
  enabled:     true
  strip_title: false
  collections: true

defaults:
  scope:
    path: ""
  values:
    layout: default

aux_links:
  "Downloads":
    - "https://github.com/Guadonna/VHemisphere/releases"
  "Screen Capture":
    - "https://github.com/PaulStoffregen/Phazerville-Screen-Capture/releases"
nav_external_links:
  - title: Firmware source
    url: https://github.com/Guadonna/VHemisphere
    opens_in_new_tab: true

collections:
  apps:
    permalink: "/:title"
    output: true
  applets:
    permalink: "/:title"
    output: true

just_the_docs:
  collections:
    apps:
      name: Apps
      nav_fold: true
    applets:
      name: Applets
      nav_fold: true

footer_content: "VHemisphere is derived from Ornament & Crime, Hemisphere Suite and Phazerville."

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/Guadonna/VHemisphere" # the github URL for your repo
gh_edit_branch: "main" # the branch that your docs is served from
gh_edit_source: docs
gh_edit_view_mode: "tree"
